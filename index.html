<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loose Ends → Reminders</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0f1115; color: #f2f2f2; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 24px; box-sizing: border-box; text-align: center;
  }
  .card { max-width: 420px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: #a8adb8; font-size: 15px; line-height: 1.5; margin: 0 0 24px; }
  button {
    font-size: 17px; font-weight: 600; padding: 14px 28px; border-radius: 12px;
    border: none; background: #3b82f6; color: white; cursor: pointer; width: 100%;
  }
  button:active { background: #2563eb; }
  button:disabled { background: #444; color: #999; }
  .note { margin-top: 18px; font-size: 13px; color: #777; }
</style>
</head>
<body>
  <div class="card">
    <h1 id="title">Loose Ends → Reminders</h1>
    <p id="subtitle">Loading…</p>
    <button id="go-btn" disabled>Sync</button>
    <div class="note">This briefly hands your tasks to Shortcuts, then sends you back to the app.</div>
  </div>

<script>
  var SHORTCUT_NAME = "Loose Ends Bulk"; // must match the shortcut's exact name

  function qs(name){
    var m = new URLSearchParams(location.search);
    return m.get(name);
  }

  var dataParam = qs("data");
  var returnParam = qs("return");
  var titleEl = document.getElementById("title");
  var subtitleEl = document.getElementById("subtitle");
  var btn = document.getElementById("go-btn");

  var payload = null;
  try { payload = JSON.parse(dataParam); } catch (e) { payload = null; }

  if (!payload || !payload.items || !payload.items.length) {
    titleEl.textContent = "Nothing to sync";
    subtitleEl.textContent = "No task data was passed to this page.";
  } else {
    var n = payload.items.length;
    subtitleEl.textContent = n + " task" + (n === 1 ? "" : "s") + " ready to send to Reminders.";
    btn.textContent = "Sync " + n + " task" + (n === 1 ? "" : "s");
    btn.disabled = false;
  }

  btn.addEventListener("click", function(){
    payload.return = returnParam || "";
    var text = JSON.stringify(payload);
    var url = "shortcuts://run-shortcut?name=" + encodeURIComponent(SHORTCUT_NAME) +
      "&input=text&text=" + encodeURIComponent(text);
    btn.disabled = true;
    btn.textContent = "Opening Shortcuts…";
    window.location.href = url;
  });
</script>
</body>
</html>
